name: Build Cubao Acount (Mac)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # chip Apple M1/M2/M3/M4
            arch: apple-chip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        env:
          PYTHON: python
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bash build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cubao-Acount-mac-${{ matrix.arch }}
          path: dist-mac/*.dmg
          retention-days: 14
